apply plugin: 'com.android.application'

// Release version is tracked in version.properties instead of being hardcoded here,
// so `scripts/release-android.js` can bump it automatically before every release build.
// The App Distribution update-checker on-device keys off versionCode, so this must
// increase on every release or existing installs will never see the update prompt.
def versionPropsFile = file('version.properties')
def versionProps = new Properties()
if (versionPropsFile.exists()) {
    versionPropsFile.withInputStream { versionProps.load(it) }
}
def appVersionCode = (versionProps['VERSION_CODE'] ?: '1').toInteger()
def appVersionName = versionProps['VERSION_NAME'] ?: '1.0.0'

// Upload-key signing for Play Store releases, kept out of git (see keystore.properties.gitignore).
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

// Without this, a machine missing keystore.properties (CI, a fresh clone — it's
// gitignored) silently falls through to signingConfigs.debug below and emits a
// debug-signed "release". The Play Store rejects that, and if one ever were
// accepted it would establish the wrong upload identity. Fail loudly instead,
// and only when a release is actually being built so debug builds still work.
if (!keystorePropsFile.exists()
        && gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }) {
    throw new org.gradle.api.GradleException(
            "android/keystore.properties is missing, so this release would be signed with the debug key. " +
            "Restore the upload keystore before building a release.")
}

android {
    namespace = "com.spicasg.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.spicasg.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig keystorePropsFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    
    // Firebase BoM
    implementation platform('com.google.firebase:firebase-bom:34.7.0')
    // Firebase Authentication
    implementation 'com.google.firebase:firebase-auth'
    // Google Play Services Auth (for Google Sign-In)
    implementation 'com.google.android.gms:play-services-auth:21.0.0'
    // NOTE: firebase-appdistribution was removed when this app moved to Play
    // Store distribution. Its SDK drives an interactive "Enable testing
    // features" tester-enrollment prompt on launch before it can determine
    // whether it's even relevant, which every Play Store user would see.
    // Play Store owns updates now; App Distribution builds can still be
    // installed via the App Distribution app, just without the in-app prompt.
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

